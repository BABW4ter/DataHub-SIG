name: Inventaire prioritaire data.gouv Val-d'Oise
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventorier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/catalogue_95.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventaire-datagouv-95
          path: outputs/catalogue_95/
          if-no-files-found: warn
