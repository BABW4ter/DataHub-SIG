name: Recherche multi-API DataHub SIG
on:
  workflow_dispatch:
    inputs:
      departement:
        description: "Code département"
        required: true
        default: "95"
      theme:
        description: "Domaine de recherche"
        type: choice
        required: true
        options:
          - tous
          - vegetation
          - eau
          - environnement
          - urbanisme
          - foncier
          - population
          - equipements
permissions:
  contents: read
jobs:
  rechercher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rechercher les jeux de données
        env:
          DEP: ${{ inputs.departement }}
          THEME: ${{ inputs.theme }}
        run: python scripts/discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-datahub
          path: outputs/
          if-no-files-found: warn
