name: Vegetation 95 - Complements MOS, BD TOPO, arbres et LiDAR
on:
  push:
    paths:
      - 'config/vegetation95-complements-run.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Télécharger et vérifier les compléments
        run: python scripts/collecte_vegetation_complements.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vegetation95-complements
          path: outputs/vegetation95_complements/
          retention-days: 30
          if-no-files-found: warn
