name: Vegetation 95 - Index dalles LiDAR HD MNH
on:
  push:
    paths:
      - 'config/vegetation95-lidar-run.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lidar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Collecter index officiel MNH
        run: python scripts/lidar_mnh_index_95.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lidar-mnh-index-95
          path: outputs/vegetation95_lidar/
          retention-days: 30
          if-no-files-found: warn
