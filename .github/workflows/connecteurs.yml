name: Collecte multi-connecteurs V0.3
on:
  workflow_dispatch:
    inputs:
      departement:
        description: "Code departement"
        required: true
        default: "95"
      theme:
        description: "Domaine"
        required: true
        type: choice
        options:
          - tous
          - vegetation
          - eau
          - environnement
          - urbanisme
          - foncier
          - population
          - equipements
permissions:
  contents: read
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Interroger les connecteurs
        env:
          DEP: ${{ inputs.departement }}
          THEMES: ${{ inputs.theme }}
        run: python scripts/connecteurs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datahub-connecteurs-v03
          path: outputs/
          if-no-files-found: warn
