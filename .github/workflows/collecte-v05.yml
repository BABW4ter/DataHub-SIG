name: DataHub SIG V0.5 - Géorisques et IGN
on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 3'
permissions:
  contents: read
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Collecter et qualifier
        env:
          DEP: '95'
        run: python scripts/collecte_v05.py
      - name: Résumé du moissonnage
        if: always()
        run: |
          if [ -f outputs/v05/statut.csv ]; then
            echo "## DataHub SIG V0.5 — bilan" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~csv' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/v05/statut.csv >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datahub-v05
          path: outputs/v05/
          retention-days: 30
          if-no-files-found: warn
